<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Reservas de hoy · Centro de Estudiantes de Química</title>
<link rel="icon" href="/favicon.ico">
<!-- La misma tipografía que la página de reservas -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<!--
  MODO PANTALLA: las reservas de hoy, para dejar en un monitor o una tele del CEQ.
  - Muestra lo mismo que el calendario público (nombre y motivo), nada más: no pide contraseña.
  - Se actualiza sola cada minuto y pasa al día siguiente a la medianoche.
  - pantalla.html?espacio=3 muestra un solo espacio (el número es el del espacio: 3 Frente, 1 Altillo).
  - pantalla.html?fecha=2026-11-20 muestra otro día (para probar).
  Todo se escribe con textContent: un nombre o un motivo nunca se toma como HTML.
  Colores y tipografía: los mismos que la página de reservas (index.html). Las variables de :root
  son una copia de las de index.html: si allá cambia un color, copiarlo acá.
-->
<style>
  /* Copia de las variables de index.html, para que las dos páginas se vean iguales */
  :root {
    --marino: #173874;
    --azul: #3873CE;
    --azul-hover: #2D62B5;
    --cielo: #D6E6FA;
    --tarjeta: #EFF7FE;
    --blanco: #FFFFFF;
    --texto: #1E1E1E;
    --suave: #5A6B85;
    --linea: #C9DBF3;
    --libre: #3873CE;
    --parcial-bg: #FFF3D6;
    --parcial: #A86A00;
    --lleno-bg: #FBE3E1;
    --lleno: #B2392F;
    --ok-bg: #E3F4EA;
    --ok: #1D7A47;
    --radio: 18px;
    --radio-chico: 8px;
    --f: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  /* Fondo celeste y letras oscuras, como la página de reservas */
  body { font-family: var(--f); background: var(--cielo); color: var(--texto); padding: clamp(12px, 2vw, 28px); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: clamp(12px, 2vw, 24px); }
  .marca { display: flex; align-items: center; gap: 14px; }
  .marca img { width: clamp(40px, 5vw, 64px); height: auto; }
  h1 { font-size: clamp(22px, 3.4vw, 44px); font-weight: 800; margin: 0; line-height: 1.1; color: var(--marino); }
  .fecha { font-size: clamp(14px, 1.6vw, 22px); font-weight: 500; color: var(--marino); margin-top: 4px; }
  .fecha::first-letter { text-transform: uppercase; }
  .reloj { font-size: clamp(30px, 5vw, 68px); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--marino); }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: clamp(12px, 1.6vw, 22px); }
  .espacio { background: var(--tarjeta); color: var(--texto); border: 1px solid var(--linea); border-radius: var(--radio); padding: clamp(14px, 1.6vw, 22px); }
  .espacio h2 { margin: 0 0 12px; font-size: clamp(20px, 2.4vw, 32px); color: var(--marino); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .espacio h2 small { font-size: .5em; font-weight: 600; color: var(--suave); }
  .franja { display: grid; grid-template-columns: minmax(96px, auto) 1fr; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--linea); }
  .franja:first-of-type { border-top: 0; }
  .hora { font-weight: 700; font-size: clamp(15px, 1.6vw, 22px); font-variant-numeric: tabular-nums; color: var(--marino); }
  .hora span { display: block; font-weight: 600; font-size: .72em; color: var(--suave); }
  .quien { font-size: clamp(16px, 1.8vw, 24px); font-weight: 600; overflow-wrap: anywhere; }
  .quien small { display: block; font-size: .7em; font-weight: 400; color: var(--suave); }
  .libre .quien { color: var(--ok); font-weight: 600; }
  .bloqueado .quien { color: var(--suave); }
  .paso { opacity: .5; }
  /* El renglón de AHORA: azul marino con letras blancas, para que se distinga de lejos sobre la tarjeta clara */
  .ahora { background: var(--marino); margin: 0 -10px; padding: 12px 10px; border-radius: 10px; border-top-color: transparent; }
  .ahora + .franja { border-top-color: transparent; }
  .ahora .hora, .ahora .quien, .ahora.libre .quien, .ahora.bloqueado .quien { color: var(--blanco); }
  .ahora .hora span, .ahora .quien small { color: #DCE8FA; }
  .ahora .hora::after { content: "AHORA"; display: inline-block; margin-left: 8px; font-size: .55em; font-weight: 800; letter-spacing: .04em; background: var(--blanco); color: var(--marino); border-radius: 4px; padding: 1px 6px; vertical-align: middle; }
  .vacio { color: var(--suave); font-size: clamp(15px, 1.6vw, 20px); margin: 6px 0 0; }
  footer { margin-top: clamp(12px, 2vw, 22px); font-size: clamp(12px, 1.2vw, 16px); font-weight: 500; color: var(--marino); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  /* "Sin conexión": rojo sobre fondo rosado, que se lee sobre el celeste */
  .error { color: var(--lleno); background: var(--lleno-bg); border: 1px solid var(--lleno); border-radius: var(--radio-chico); padding: 4px 10px; font-weight: 700; }
</style>
</head>
<body>
  <header>
    <div class="marca">
      <img src="logo-ceq.png" alt="Logo del CEQ">
      <div>
        <h1 id="titulo">Reservas de hoy</h1>
        <div class="fecha" id="fecha"></div>
      </div>
    </div>
    <div class="reloj" id="reloj" aria-label="Hora actual"></div>
  </header>

  <main id="espacios" aria-live="polite"></main>

  <footer>
    <span>Reservá en reservas.ceq-una.com</span>
    <span id="estado" role="status"></span>
  </footer>

<script>
  const API_BASE = 'https://api.ceq-una.com/api';
  const parametros = new URLSearchParams(location.search);
  const soloEspacio = /^\d{1,6}$/.test(parametros.get('espacio') || '') ? Number(parametros.get('espacio')) : null;
  const fechaFija = /^\d{4}-\d{2}-\d{2}$/.test(parametros.get('fecha') || '') ? parametros.get('fecha') : null;

  const crear = (etiqueta, clase, texto) => {
    const el = document.createElement(etiqueta);
    if (clase) el.className = clase;
    if (texto != null) el.textContent = texto;
    return el;
  };
  // Fecha y hora en Paraguay, sin depender del huso de la pantalla
  const partes = () => Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Asuncion', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  }).formatToParts(new Date()).map(x => [x.type, x.value]));
  const hoy = () => { const p = partes(); return `${p.year}-${p.month}-${p.day}`; };
  const minutosAhora = () => { const p = partes(); return Number(p.hour) * 60 + Number(p.minute); };
  const aMinutos = hhmm => { const [h, m] = String(hhmm).substring(0, 5).split(':').map(Number); return h * 60 + m; };
  const hhmm = texto => String(texto).substring(0, 5);

  function ponerReloj() {
    const p = partes();
    document.getElementById('reloj').textContent = `${p.hour}:${p.minute}`;
    const dia = fechaFija || hoy();
    const [a, m, d] = dia.split('-').map(Number);
    document.getElementById('fecha').textContent = new Intl.DateTimeFormat('es-PY', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(Date.UTC(a, m - 1, d)));
    document.getElementById('titulo').textContent = fechaFija && fechaFija !== hoy() ? 'Reservas del día' : 'Reservas de hoy';
  }

  async function leer(ruta) {
    const res = await fetch(API_BASE + ruta, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${ruta}: ${res.status}`);
    return res.json();
  }

  // Una fila: horario a la izquierda y, a la derecha, quién lo tiene (o "Libre")
  function fila(inicio, fin, nombreTurno, ocupacion, esHoy) {
    const ahora = minutosAhora();
    const clases = ['franja'];
    if (!ocupacion) clases.push('libre');
    if (ocupacion && ocupacion.bloqueo) clases.push('bloqueado');
    if (esHoy && aMinutos(fin) <= ahora) clases.push('paso');
    if (esHoy && aMinutos(inicio) <= ahora && ahora < aMinutos(fin)) clases.push('ahora');
    const div = crear('div', clases.join(' '));
    const hora = crear('div', 'hora', `${inicio} – ${fin}`);
    if (nombreTurno) hora.prepend(crear('span', '', nombreTurno));
    const quien = crear('div', 'quien', ocupacion ? (ocupacion.bloqueo ? 'No disponible' : ocupacion.nombre_solicitante || 'Reservado') : 'Libre');
    if (ocupacion && !ocupacion.bloqueo && ocupacion.motivo) quien.append(crear('small', '', ocupacion.motivo));
    div.append(hora, quien);
    return div;
  }

  async function actualizar() {
    const estado = document.getElementById('estado');
    try {
      const dia = fechaFija || hoy();
      const [config, lista, reservas, bloqueos] = await Promise.all([leer('/configuracion'), leer('/espacios'), leer(`/reservas?fecha=${dia}`), leer('/bloqueos')]);
      const defs = config && config.espacios && typeof config.espacios === 'object' ? config.espacios : {};
      const publicos = new Set((Array.isArray(lista) ? lista : []).filter(e => e.publico === true).map(e => Number(e.id)));
      const ids = Object.keys(defs).map(Number).filter(id => publicos.has(id) && (soloEspacio === null || id === soloEspacio));
      // El Frente primero, después el Altillo y después los demás
      ids.sort((a, b) => ((a === 3 ? -2 : a === 1 ? -1 : a) - (b === 3 ? -2 : b === 1 ? -1 : b)));
      const esHoy = dia === hoy();
      const contenedor = document.getElementById('espacios');
      const tarjetas = ids.map(id => {
        const d = defs[id];
        const suyas = (Array.isArray(reservas) ? reservas : []).filter(r => Number(r.espacio_id) === id && r.fecha === dia)
          .sort((a, b) => aMinutos(a.hora_inicio) - aMinutos(b.hora_inicio));
        const cierres = (Array.isArray(bloqueos) ? bloqueos : []).filter(b => Number(b.espacio_id) === id && b.fecha === dia).map(b => ({ ...b, bloqueo: true }));
        const ocupaciones = [...suyas, ...cierres];
        const queOcupa = (inicio, fin) => ocupaciones.find(o => aMinutos(o.hora_inicio) < aMinutos(fin) && aMinutos(inicio) < aMinutos(o.hora_fin));
        const tarjeta = crear('section', 'espacio');
        const titulo = crear('h2', '', d.nombre || `Espacio ${id}`);
        titulo.append(crear('small', '', suyas.length === 1 ? '1 reserva' : `${suyas.length} reservas`));
        tarjeta.append(titulo);
        if (d.horario === 'turnos') {
          // Un renglón por turno, ocupado o libre
          (d.turnos || []).forEach(t => tarjeta.append(fila(t.inicio, t.fin, t.nombre, queOcupa(t.inicio, t.fin), esHoy)));
        } else {
          // Por bloques: las reservas del día, en orden
          const todoElDia = cierres.find(b => aMinutos(b.hora_inicio) === 0 && aMinutos(b.hora_fin) >= 23 * 60);
          if (todoElDia) tarjeta.append(crear('p', 'vacio', 'No disponible hoy.'));
          else if (!ocupaciones.length) tarjeta.append(crear('p', 'vacio', `Sin reservas. Libre de ${String(d.hora_desde).padStart(2, '0')}:00 a ${String(d.hora_hasta).padStart(2, '0')}:00.`));
          else ocupaciones.sort((a, b) => aMinutos(a.hora_inicio) - aMinutos(b.hora_inicio)).forEach(o => tarjeta.append(fila(hhmm(o.hora_inicio), hhmm(o.hora_fin), '', o, esHoy)));
        }
        return tarjeta;
      });
      contenedor.replaceChildren(...(tarjetas.length ? tarjetas : [crear('p', 'vacio', 'No hay espacios para mostrar.')]));
      const p = partes();
      estado.className = '';
      estado.textContent = `Actualizado a las ${p.hour}:${p.minute}`;
    } catch (error) {
      console.error(error);
      estado.className = 'error';
      estado.textContent = 'Sin conexión con el sistema. Se vuelve a intentar en un minuto.';
    }
  }

  ponerReloj();
  actualizar();
  setInterval(ponerReloj, 5000);
  setInterval(actualizar, 60000);
</script>
</body>
</html>
